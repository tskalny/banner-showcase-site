<!DOCTYPE html>

<html>

<head>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width" />

<meta name="ad.size" content="width=320,height=320">
<script type="text/javascript">
    var clickTag = "https://www.padelcentertierp.se/";
</script>

<title>Banner</title>

<script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.5.1_min.js"></script>

<style type="text/css">

html{align-items:center; display:flex; height:100%; width:100%; }

body{margin:0; padding:0; margin-left:auto; margin-right:auto;}



.main-container{

	position: relative;

	width: 320px;

	height: 320px;

	overflow: hidden;

	background-color: #ffff;

	cursor: pointer;

	opacity: 0;

}



.img{

	position: absolute;

	left: 0px;

	top: 0px;

	width: 100%;

	height: 100%;

	-ms-transform: rotate(0.01deg); /* IE 9 */

    -webkit-transform: rotate(0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(0.01deg);

    background-repeat: no-repeat;

    background-size: contain;

}



.img img{

	position: absolute;

	left: 0px;

	top: 0px;

	height: 100%;

	-ms-transform: rotate(-0.01deg); /* IE 9 */

    -webkit-transform: rotate(-0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(-0.01deg);

     backface-visibility: hidden;

	-webkit-transform-style: preserve-3d;

	-moz-transform-style: preserve-3d;

	-ms-transform-style: preserve-3d;

	-o-transform-style: preserve-3d;

	transform-style: preserve-3d;

    image-rendering: -webkit-optimize-contrast;

    image-rendering: -webkit-crisp-edges;

    will-change:transform;

}



.border{

	position: absolute;

	width: 100%;

	height: 100%;

	border: 1px solid #cccccc;

	-webkit-box-sizing: border-box;

	-moz-box-sizing: border-box;

	box-sizing: border-box;

}

.pl2{
top: 165px;
left: -5px;
width: 50%;
height: 50%;
}
.filtr{
mix-blend-mode: hard-light;
position: absolute;
opacity: 0.8;
}





</style>

</head>

<body>

<a href="javascript:window.open(window.clickTag)">

<div class="main-container" id="banner">
	
	<div class="img bg"><img src="bg.jpg"></div>
	<div class="img pl"><img src="pl.png"></div>
	<div class="img pl2"><img src="pl2.jpg"></div>
	<div class="img logo"><img src="logo.png"></div>
	<div class="img t1"><img src="t1.png"></div>
	<div class="img t2"><img src="t2.png"></div>
	<div class="img t3"><img src="t3.png"></div>
	<div class="img bt"><img src="bt.png"></div>
	
<div class="border"></div>

</div>
</a>



<script>

gsap.set(".main-container", {autoAlpha:1});

var bannerWidth = document.querySelector("#banner").offsetWidth;

var bannerHeight = document.querySelector("#banner").offsetHeight;

var loops = 1;

gsap.set(".bt", { transformOrigin:"180px 180px"});



var tl=new TimelineMax({repeat:1,delay:0,onComplete:function(){this.tweenFromTo("start","end")}});



tl .addLabel("start")
.to(".bg1", 3.0, { scale:1.05,   ease:"back.out(1,0.3)"},0.0)
.from(".t1, .t2", 0.5, {y:"-3%", stagger:0.5, autoAlpha:0, ease:Power2.easeOut},0.3)
.from(".t3", 0.5, {x:"-100%", autoAlpha:0, ease:Power2.easeOut},1.3)
.to(".pl2", 9.0, { x:"-100%",  ease:"back.out(1,0.3)"},0.0)
.to(".bg1", 0.6, { autoAlpha:0,  ease:"back.out(1,0.3)"},3.3)




.from(".bt", 0.5, {y:"-1%", autoAlpha:0, ease:Power2.easeOut},1.5).addLabel("end")



.to(" .t1, .t2, .bt", 0.5, { autoAlpha:0, ease:Power2.inOut},9.0)

</script>

</body>

</html>
