<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width" />
<title>Banner</title>
<script>
    /* ad-server script removed for showcase */
window.asxhtml5={getParam:function(k,d){return d}};window.dhtml={getVar:function(k,d){return d},external:{}};window.clickTag=window.clickTag||"#";
</script>
<script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.5.1_min.js"></script>
<style type="text/css">

html{align-items:center; display:flex; height:100%; width:100%; }

body{margin:0; padding:0; margin-left:auto; margin-right:auto;}



.main-container{

	position: relative;

	width: 320px;

	height: 250px;

	overflow: hidden;

	background-color: #efefef;

	cursor: pointer;

	opacity: 0;

}



.img{

	position: absolute;

	left: 0px;

	top: 0px;

	width: 100%;

	height: 100%;

	-ms-transform: rotate(0.01deg); /* IE 9 */

    -webkit-transform: rotate(0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(0.01deg);

    background-repeat: no-repeat;

    background-size: contain;

}



.img img{

	position: absolute;

	left: 0px;

	top: 0px;

	height: 100%;

	-ms-transform: rotate(-0.01deg); /* IE 9 */

    -webkit-transform: rotate(-0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(-0.01deg);

     backface-visibility: hidden;

	-webkit-transform-style: preserve-3d;

	-moz-transform-style: preserve-3d;

	-ms-transform-style: preserve-3d;

	-o-transform-style: preserve-3d;

	transform-style: preserve-3d;

    image-rendering: -webkit-optimize-contrast;

    image-rendering: -webkit-crisp-edges;

    will-change:transform;

}



.border{

	position: absolute;

	width: 100%;

	height: 100%;

	border: 1px solid #cccccc;

	-webkit-box-sizing: border-box;

	-moz-box-sizing: border-box;

	box-sizing: border-box;

}

.pl{

position: absolute;



transform: scale(1.05);



}





</style>

</head>

<body>

<div class="main-container" id="banner">
	<div class="img pl1"><img src="pl1.png"></div>
	<div class="img pl2"><img src="pl2.png"></div>
	<div class="img pl3"><img src="pl3.png"></div>
	<div class="img pl4"><img src="pl4.png"></div>
	<div class="img logo"><img src="logo.png"></div>
	<div class="img bt"><img src="bt.png"></div>
	<div class="img t1"><img src="t1.png"></div>
	<div class="img t2"><img src="t2.png"></div>
<div class="border"></div>

</div>




<script>

gsap.set(".main-container", {autoAlpha:1});

var bannerWidth = document.querySelector("#banner").offsetWidth;

var bannerHeight = document.querySelector("#banner").offsetHeight;

var loops = 1;

gsap.set(".bt", { transformOrigin:"20px 140px"});



var tl=new TimelineMax({repeat:1,delay:0,onComplete:function(){this.tweenFromTo("start","end")}});



tl .addLabel("start")


.from(".t1, .t2", 0.8, {x:"-100%",stagger:0.4, autoAlpha:0, ease:Back.easeOut},0.3)

.from(".pl1, .pl2, .pl3, .pl4", 0.3, { x:-15, autoAlpha:0, stagger:0.3, ease:Back.easeOut},0.5)


.from(".bt", 0.5, {x:"-100%", autoAlpha:0, ease:Power2.easeOut},0.6).addLabel("end")

.to(".bt", 0.6, { yoyo:true, repeat:3, scale:1.1,  ease:"back.out(1,0.3)"},3.5)

.to(".bt", 0.6, { yoyo:true, repeat:3, scale:1.1, ease:"back.out(1,0.3)"},6.5)

.to(" .t1, .t2, .t3, .t4, .bt, .key", 0.5, { autoAlpha:0, ease:Power2.inOut},9.0)

</script>
<script>
 var clickArea = document.getElementById('banner');

 clickTAGvalue = dhtml.getVar('clickTAG', 'https://coopstorlien.se');
 landingpagetarget = dhtml.getVar('landingPageTarget', '_blank');

 clickArea.onclick = function() {
 window.open(clickTAGvalue,landingpagetarget);
 }
</script>

</body>

</html>
