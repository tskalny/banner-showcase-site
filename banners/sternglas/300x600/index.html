<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width" />
<title>Banner</title>
<script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.5.1_min.js"></script>
<script>
    /* ad-server script removed for showcase */
window.asxhtml5={getParam:function(k,d){return d}};window.dhtml={getVar:function(k,d){return d},external:{}};window.clickTag=window.clickTag||"#";
</script>
<style type="text/css">
html{align-items:center; display:flex; height:100%; width:100%; }
body{margin:0; padding:0; margin-left:auto; margin-right:auto;}



.main-container{

	position: relative;

	width: 300px;

	height: 600px;

	overflow: hidden;

	background-color: #ffff;

	cursor: pointer;

	opacity: 0;

}



.img{

	position: absolute;

	left: 0px;

	top: 0px;

	width: 100%;

	height: 100%;

	-ms-transform: rotate(0.01deg); /* IE 9 */

    -webkit-transform: rotate(0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(0.01deg);

    background-repeat: no-repeat;

    background-size: contain;

}



.img img{

	position: absolute;

	left: 0px;

	top: 0px;

	height: 100%;

	-ms-transform: rotate(-0.01deg); /* IE 9 */

    -webkit-transform: rotate(-0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(-0.01deg);

     backface-visibility: hidden;

	-webkit-transform-style: preserve-3d;

	-moz-transform-style: preserve-3d;

	-ms-transform-style: preserve-3d;

	-o-transform-style: preserve-3d;

	transform-style: preserve-3d;

    image-rendering: -webkit-optimize-contrast;

    image-rendering: -webkit-crisp-edges;

    will-change:transform;

}



.border{

	position: absolute;

	width: 100%;

	height: 100%;

	border: 1px solid #cccccc;

	-webkit-box-sizing: border-box;

	-moz-box-sizing: border-box;

	box-sizing: border-box;

}

.pl{

position: absolute;
transform: scale(1);

}
.filtr{
mix-blend-mode: hard-light;
position: absolute;
opacity: 0.8;
}





</style>

</head>

<body>

<a href="javascript:window.open(window.clickTag)">

<div class="main-container" id="banner">
	<div class="img bg4"><img src="bg4.jpg"></div>
	<div class="img bg3"><img src="bg3.jpg"></div>
	<div class="img bg2"><img src="bg2.jpg"></div>
	<div class="img bg1"><img src="bg1.jpg"></div>
	<div class="img logo"><img src="logo.png"></div>
	<div class="img logo2"><img src="logo2.png"></div>
	<div class="img t1"><img src="t1.png"></div>
	<div class="img t2"><img src="t2.png"></div>
	<div class="img bt"><img src="bt.png"></div>
	
<div class="border"></div>

</div>
</a>



<script>

gsap.set(".main-container", {autoAlpha:1});

var bannerWidth = document.querySelector("#banner").offsetWidth;

var bannerHeight = document.querySelector("#banner").offsetHeight;

var loops = 1;

gsap.set(".bt", { transformOrigin:"180px 180px"});

var tl=new TimelineMax({repeat:0,delay:0,onComplete:function(){this.tweenFromTo("start","end")}});


tl .addLabel("start")
.to(".bg1", 3.0, { scale:1.05,   ease:"back.out(1,0.3)"},0.0)
.from(".t1", 1.0, {x:"-3%", stagger:0.5, autoAlpha:0, ease:Power2.easeOut},0.3)
.from(".bt", 1.0, {x:"3%", autoAlpha:0, ease:Power2.easeOut},0.3)
.to(".t1", 1.0, {x:"-3%", stagger:0.5, autoAlpha:0, ease:Power2.easeOut},3.3)

.to(".bg2", 3.0, { scale:1.1,  ease:"back.out(1,0.3)"},4.3)
.to(".bg1", 0.6, { autoAlpha:0,  ease:"back.out(1,0.3)"},4.3)
.from(".t2", 0.8, {x:"-3%", stagger:0.5, autoAlpha:0, ease:Power2.easeOut},4.3)
.to(".bg2", 0.6, { autoAlpha:0,  ease:"back.out(1,0.3)"},8.0)
.to(".bg3", 3.0, { scale:1.1,  ease:"back.out(1,0.3)"},8.0)
.from(".logo2", 0.8, {x:"-3%", stagger:0.5, autoAlpha:0, ease:Power2.easeOut},10.1).addLabel("end")
.to(".bg3", 0.6, { autoAlpha:0,  ease:"back.out(1,0.3)"},10.0)
.to(".bg4", 3.0, { scale:1.1,  ease:"back.out(1,0.3)"},10.0)

.to(".t2, .bt", 0.5, { autoAlpha:0, ease:Power2.inOut},13.0)

</script>
<script>
	var clickurl = asxhtml5.getParam('clickurl', '#');
	var clickDiv = document.getElementById('banner');
	clickDiv.onclick = function() {
		window.open(clickurl,'_blank');
	}
</script>

</body>

</html>
